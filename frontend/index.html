<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Screener</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
            background: #0f1117;
            min-height: 100vh;
            padding: 40px 20px;
            color: #e2e8f0;
        }
        .container { max-width: 860px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 40px; }
        header h1 { font-size: 38px; color: #ffffff; font-weight: 800; letter-spacing: -1px; }
        header p { color: #64748b; margin-top: 8px; font-size: 15px; }

        .card {
            background: #1a1d27; border: 1px solid #2d3148;
            border-radius: 20px; padding: 32px; margin-bottom: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .section-title {
            font-weight: 700; display: block; margin-bottom: 10px;
            color: #94a3b8; font-size: 12px;
            text-transform: uppercase; letter-spacing: 1px;
        }

        textarea {
            width: 100%; height: 140px; padding: 14px;
            border-radius: 10px; border: 1.5px solid #2d3148;
            background: #0f1117; font-size: 14px; resize: vertical;
            font-family: inherit; color: #e2e8f0; transition: border 0.2s;
        }
        textarea:focus { outline: none; border-color: #4f63d2; }
        textarea::placeholder { color: #475569; }

        .upload-box {
            border: 2px dashed #2d3148; border-radius: 12px;
            padding: 28px; text-align: center; margin-top: 8px;
            background: #0f1117; cursor: pointer; transition: all 0.2s;
        }
        .upload-box:hover { border-color: #4f63d2; background: #151929; }
        input[type="file"] { display: none; }
        .upload-icon { font-size: 32px; margin-bottom: 8px; }
        .file-label { color: #4f63d2; font-weight: 700; font-size: 15px; }
        .file-hint { color: #475569; font-size: 13px; margin-top: 4px; }
        #fileList { margin-top: 10px; font-size: 13px; color: #4f63d2; font-weight: 600; }

        button.submit-btn {
            background: linear-gradient(135deg, #4f63d2, #6366f1);
            color: white; padding: 16px; border: none; border-radius: 12px;
            cursor: pointer; font-size: 16px; font-weight: 700;
            width: 100%; margin-top: 24px; transition: all 0.2s;
        }
        button.submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(79,99,210,0.5); }
        button.submit-btn:disabled { background: #2d3148; color: #475569; cursor: not-allowed; transform: none; }

        #results { margin-top: 10px; }
        .results-header {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 16px; padding: 0 4px;
        }
        .results-header h2 { font-size: 22px; color: #ffffff; font-weight: 700; }
        .results-header span {
            color: #64748b; font-size: 13px;
            background: #1a1d27; border: 1px solid #2d3148;
            padding: 4px 12px; border-radius: 20px;
        }

        .chart-title {
            font-size: 13px; color: #64748b;
            text-transform: uppercase; letter-spacing: 1px;
            font-weight: 700; margin-bottom: 16px;
        }

        .chart-wrapper {
            max-width: 300px; margin: 0 auto;
        }

        .resume-card {
            background: #1a1d27; border: 1px solid #2d3148;
            border-radius: 16px; padding: 24px; margin-bottom: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            border-left: 4px solid #2d3148;
            animation: fadeIn 0.4s ease;
        }
        .resume-card.high { border-left-color: #16a34a; }
        .resume-card.medium { border-left-color: #d97706; }
        .resume-card.low { border-left-color: #dc2626; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .resume-top {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 14px;
        }
        .left-info { display: flex; align-items: center; gap: 12px; }
        .rank-badge {
            display: inline-flex; align-items: center; justify-content: center;
            width: 32px; height: 32px; border-radius: 50%;
            background: #2d3148; color: white; font-weight: 800; font-size: 13px;
        }
        .rank-badge.gold { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .rank-badge.silver { background: linear-gradient(135deg, #9ca3af, #6b7280); }
        .rank-badge.bronze { background: linear-gradient(135deg, #b45309, #92400e); }

        .filename { font-weight: 700; color: #e2e8f0; font-size: 15px; }
        .score-text { font-weight: 800; font-size: 22px; }
        .score-text.high { color: #4ade80; }
        .score-text.medium { color: #fbbf24; }
        .score-text.low { color: #f87171; }

        .progress-bar-bg {
            background: #0f1117; border-radius: 8px; height: 8px; overflow: hidden;
        }
        .progress-bar-fill { height: 100%; border-radius: 8px; transition: width 0.8s ease; }
        .progress-bar-fill.high { background: linear-gradient(90deg, #16a34a, #4ade80); }
        .progress-bar-fill.medium { background: linear-gradient(90deg, #d97706, #fbbf24); }
        .progress-bar-fill.low { background: linear-gradient(90deg, #dc2626, #f87171); }

        .divider { border: none; border-top: 1px solid #2d3148; margin: 16px 0; }

        .skills-section { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 4px; }
        .skill-group { flex: 1; min-width: 200px; }
        .skill-group-title {
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.5px; margin-bottom: 8px;
        }
        .skill-group-title.matched { color: #4ade80; }
        .skill-group-title.missing { color: #f87171; }
        .badges { display: flex; flex-wrap: wrap; gap: 6px; }
        .badge {
            display: inline-block; padding: 4px 12px;
            border-radius: 20px; font-size: 12px; font-weight: 600;
        }
        .badge.matched { background: #052e16; color: #4ade80; border: 1px solid #166534; }
        .badge.missing { background: #2d0a0a; color: #f87171; border: 1px solid #7f1d1d; }

        .summary-box {
            margin-top: 16px; background: #151929;
            border-radius: 10px; padding: 14px 16px;
            border-left: 3px solid #4f63d2;
        }
        .summary-label {
            font-size: 11px; font-weight: 700; color: #4f63d2;
            text-transform: uppercase; letter-spacing: 0.5px;
            display: block; margin-bottom: 6px;
        }
        .summary-text { font-size: 13px; color: #94a3b8; line-height: 1.7; }

        .download-btn {
            background: #1a1d27; color: #4f63d2;
            border: 1px solid #4f63d2; border-radius: 8px;
            padding: 10px 20px; font-size: 13px; font-weight: 700;
            cursor: pointer; margin-top: 20px; transition: all 0.2s;
            display: block; width: 100%; text-align: center;
        }
        .download-btn:hover { background: #4f63d2; color: white; }

        .spinner {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 16px; padding: 60px;
        }
        .spinner-circle {
            width: 44px; height: 44px; border: 4px solid #2d3148;
            border-top: 4px solid #4f63d2; border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .spinner p { font-size: 15px; color: #64748b; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-box {
            background: #2d0a0a; border: 1px solid #7f1d1d;
            border-radius: 12px; padding: 20px; color: #f87171;
            text-align: center; font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 AI Resume Screener</h1>
            <p>Instantly rank candidates against your job description using AI</p>
        </header>

        <div class="card">
            <span class="section-title">Job Description</span>
            <textarea id="jobDesc" placeholder="Paste the job description here..."></textarea>

            <span class="section-title" style="margin-top: 24px; display: block;">Upload Resumes (PDF)</span>
            <div class="upload-box" onclick="document.getElementById('resumes').click()">
                <div class="upload-icon">📄</div>
                <div class="file-label">Click to choose PDF files</div>
                <div class="file-hint">You can upload multiple resumes at once</div>
                <input type="file" id="resumes" multiple accept=".pdf" onchange="updateFileList()">
                <div id="fileList"></div>
            </div>

            <button class="submit-btn" id="submitBtn" onclick="screenResumes()">
                ⚡ Screen Resumes
            </button>
        </div>

        <div id="results"></div>
    </div>

    <script>
        let lastData = null;

        function updateFileList() {
            const files = document.getElementById('resumes').files;
            const fileList = document.getElementById('fileList');
            fileList.textContent = files.length === 0 ? '' : `✅ ${files.length} file(s) selected`;
        }

        function getScoreCategory(score) {
            if (score >= 60) return 'high';
            if (score >= 30) return 'medium';
            return 'low';
        }

        function getRankClass(index) {
            if (index === 0) return 'gold';
            if (index === 1) return 'silver';
            if (index === 2) return 'bronze';
            return '';
        }

        async function screenResumes() {
            const jobDesc = document.getElementById('jobDesc').value;
            const resumes = document.getElementById('resumes').files;
            const btn = document.getElementById('submitBtn');
            const resultsDiv = document.getElementById('results');

            if (!jobDesc || resumes.length === 0) {
                alert('Please fill in the job description and upload at least one resume!');
                return;
            }

            const formData = new FormData();
            formData.append('job_description', jobDesc);
            for (let resume of resumes) formData.append('resumes', resume);

            btn.disabled = true;
            btn.textContent = '⏳ Analyzing...';
            resultsDiv.innerHTML = `
                <div class="card">
                    <div class="spinner">
                        <div class="spinner-circle"></div>
                        <p>AI is analyzing your resumes...</p>
                    </div>
                </div>`;

            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 60000);
                const response = await fetch('https://ai-resume-screener-o0gp.onrender.com/screen', {
                    method: 'POST', body: formData, signal: controller.signal
                });
                clearTimeout(timeout);
                const text = await response.text();
                const data = JSON.parse(text);
                if (data && data.results) {
                    lastData = data;
                    renderResults(data);
                } else {
                    resultsDiv.innerHTML = `<div class="error-box">⚠️ Something went wrong. Please try again!</div>`;
                }
            } catch (error) {
                resultsDiv.innerHTML = error.name === 'AbortError'
                    ? `<div class="error-box">⏱️ Request timed out. Please try again!</div>`
                    : `<div class="error-box">❌ Error: ${error.message}</div>`;
            }

            btn.disabled = false;
            btn.textContent = '⚡ Screen Resumes';
        }

        function downloadReport() {
            if (!lastData) return;
            let text = '🤖 AI RESUME SCREENER REPORT\n================================\n\n';
            lastData.results.forEach((r, i) => {
                text += `#${i+1} ${r.filename}\n`;
                text += `Score: ${r.score}%\n`;
                text += `Matched Skills: ${r.matched_skills.join(', ')}\n`;
                text += `Missing Skills: ${r.missing_skills.join(', ')}\n`;
                text += `Summary: ${r.summary}\n`;
                text += '--------------------------------\n\n';
            });
            const blob = new Blob([text], {type: 'text/plain'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'screening-report.txt';
            a.click();
        }

        function renderResults(data) {
            const resultsDiv = document.getElementById('results');
            const high = data.results.filter(r => r.score >= 60).length;
            const medium = data.results.filter(r => r.score >= 30 && r.score < 60).length;
            const low = data.results.filter(r => r.score < 30).length;

            let html = `
                <div class="results-header">
                    <h2>🏆 Candidate Rankings</h2>
                    <span>${data.total_resumes} resume(s) analyzed</span>
                </div>
                <div class="card">
                    <div class="chart-title">📊 Score Distribution</div>
                    <div class="chart-wrapper">
                        <canvas id="scoreChart"></canvas>
                    </div>
                    <button class="download-btn" onclick="downloadReport()">📥 Download Report</button>
                </div>`;

            data.results.forEach((resume, index) => {
                const category = getScoreCategory(resume.score);
                const rankClass = getRankClass(index);
                html += `
                    <div class="resume-card ${category}">
                        <div class="resume-top">
                            <div class="left-info">
                                <span class="rank-badge ${rankClass}">#${index + 1}</span>
                                <span class="filename">${resume.filename}</span>
                            </div>
                            <span class="score-text ${category}">${resume.score}%</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill ${category}" style="width: ${resume.score}%;"></div>
                        </div>
                        <hr class="divider">
                        <div class="skills-section">
                            ${resume.matched_skills && resume.matched_skills.length > 0 ? `
                                <div class="skill-group">
                                    <div class="skill-group-title matched">✓ Matched Skills</div>
                                    <div class="badges">${resume.matched_skills.map(s => `<span class="badge matched">${s}</span>`).join('')}</div>
                                </div>` : ''}
                            ${resume.missing_skills && resume.missing_skills.length > 0 ? `
                                <div class="skill-group">
                                    <div class="skill-group-title missing">✗ Missing Skills</div>
                                    <div class="badges">${resume.missing_skills.map(s => `<span class="badge missing">${s}</span>`).join('')}</div>
                                </div>` : ''}
                        </div>
                        ${resume.summary ? `
                        <div class="summary-box">
                            <span class="summary-label">🤖 AI Summary</span>
                            <p class="summary-text">${resume.summary}</p>
                        </div>` : ''}
                    </div>`;
            });

            resultsDiv.innerHTML = html;

            setTimeout(() => {
                const ctx = document.getElementById('scoreChart').getContext('2d');
                new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Strong Match (60%+)', 'Good Match (30-60%)', 'Low Match (<30%)'],
                        datasets: [{
                            data: [high, medium, low],
                            backgroundColor: ['rgba(74,222,128,0.8)', 'rgba(251,191,36,0.8)', 'rgba(248,113,113,0.8)'],
                            borderColor: ['#4ade80', '#fbbf24', '#f87171'],
                            borderWidth: 2,
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: { color: '#94a3b8', padding: 20 }
                            }
                        }
                    }
                });
            }, 100);
        }
    </script>
</body>
</html>
